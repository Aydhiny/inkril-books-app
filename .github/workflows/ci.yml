name: Inkril CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── .NET Backend ──────────────────────────────────────────────────────────
  backend:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: 220088_test
          POSTGRES_USER: inkril
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Inkril.sln

      - name: Build
        run: dotnet build Inkril.sln --no-restore -c Release

      - name: Test
        run: dotnet test Inkril.sln --no-build -c Release --logger "trx;LogFileName=results.trx"
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=220088_test;Username=inkril;Password=ci_test_password"
          Jwt__Key: "ci-only-secret-key-32-chars-min-ok"
          Jwt__Issuer: "inkril-api-ci"
          Jwt__Audience: "inkril-clients-ci"
          RabbitMQ__Host: "localhost"
          RabbitMQ__Password: "ci_password"

  # ── Flutter Mobile ────────────────────────────────────────────────────────
  flutter-mobile:
    name: Flutter Mobile Analyze & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # ── Flutter Desktop ───────────────────────────────────────────────────────
  flutter-desktop:
    name: Flutter Desktop Analyze & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # ── Docker Build Check ────────────────────────────────────────────────────
  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for CI
        run: |
          cat << 'EOF' > .env
          POSTGRES_DB=220088
          POSTGRES_USER=inkril
          POSTGRES_PASSWORD=ci_test_password
          JWT_KEY=ci-only-secret-key-32-chars-min-ok
          JWT_ISSUER=inkril-api
          JWT_AUDIENCE=inkril-clients
          RABBITMQ_USERNAME=inkril
          RABBITMQ_PASSWORD=ci_test_password
          REDIS_PASSWORD=ci_test_password
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USERNAME=test
          SMTP_PASSWORD=test
          SMTP_USE_SSL=false
          SMTP_FROM_NAME=Inkril
          SMTP_FROM_EMAIL=ci@inkril.app
          API_PORT=8080
          ASPNETCORE_ENVIRONMENT=Development
          EOF

      - name: Build Docker images
        run: docker compose build --no-cache api worker
