version: "3.9"

# ============================================================
# Inkril — Full Stack Docker Compose
# All sensitive values come from the .env file (see .env.example).
# Start: docker compose up -d
# ============================================================

services:

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: inkril_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-220088}
      POSTGRES_USER: ${POSTGRES_USER:-inkril}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inkril}"]
      interval: 10s
      retries: 5

  # ── Redis (leaderboard caching) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: inkril_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # ── RabbitMQ (message broker between API and Worker) ──────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: inkril_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-inkril}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      retries: 10

  # ── Main API (Microservice 1) ─────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: inkril_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-220088};Username=${POSTGRES_USER:-inkril};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-inkril-api}
      Jwt__Audience: ${JWT_AUDIENCE:-inkril-clients}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-inkril}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      Smtp__FromName: ${SMTP_FROM_NAME:-Inkril}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inkril_net

  # ── Notification Worker (Microservice 2) ─────────────────
  # Separate container — satisfies the professor's "two separate services" requirement.
  # This is NOT Hangfire — it is a fully independent .NET Worker Service.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: inkril_worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-220088};Username=${POSTGRES_USER:-inkril};Password=${POSTGRES_PASSWORD}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-inkril}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      Smtp__FromName: ${SMTP_FROM_NAME:-Inkril}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inkril_net

networks:
  inkril_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
