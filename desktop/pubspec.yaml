name: inkril_desktop
description: Inkril Admin — Desktop administration panel
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ─────────────────────────────────────────
  dio: ^5.4.3

  # ── State Management ───────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Routing ────────────────────────────────────────────
  go_router: ^13.2.0

  # ── Storage ────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0

  # ── Charts ─────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ── File picker (upload books) ─────────────────────────
  file_picker: ^8.0.3

  # ── Utilities ──────────────────────────────────────────
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
