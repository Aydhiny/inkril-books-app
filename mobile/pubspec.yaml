name: inkril_mobile
description: Inkril — Gamified book reading app (mobile)
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ─────────────────────────────────────────
  dio: ^5.4.3
  retrofit: ^4.1.0

  # ── State Management ───────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Routing ────────────────────────────────────────────
  go_router: ^13.2.0

  # ── Storage ────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # ── PDF Reader ─────────────────────────────────────────
  flutter_pdfview: ^1.3.2

  # ── UI ─────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0          # Reading progress charts
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # ── File System ────────────────────────────────────────
  path_provider: ^2.1.3

  # ── Utilities ──────────────────────────────────────────
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
