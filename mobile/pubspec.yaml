name: inkril_mobile
description: Inkril — Gamified book reading app (mobile)
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ─────────────────────────────────────────
  dio: ^5.4.3

  # ── State Management ───────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Routing ────────────────────────────────────────────
  go_router: ^13.2.0

  # ── Storage ────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0

  # ── PDF Reader ─────────────────────────────────────────
  flutter_pdfview: ^1.3.2

  # ── UI ─────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  confetti: ^0.7.0

  # ── File System ────────────────────────────────────────
  path_provider: ^2.1.3
  file_picker: ^8.1.2

  # ── Payments ───────────────────────────────────────────
  flutter_stripe: ^10.1.1

  # ── Utilities ──────────────────────────────────────────
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
